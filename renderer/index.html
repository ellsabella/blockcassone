<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pipeline</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      color: #bbb;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      height: 100%;
    }
    #gl {
      display: block;

      white-space: pre;
      line-height: 1.4;
    }
  </style>
</head>

  <canvas id="gl"></canvas>
  <div id="log"></div>
  <script type="module" src="/src/main.js"></script>
