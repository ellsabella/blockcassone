  :root {
    --bg: #030304; --ink: #c8c8cc; --pink: #ff3ab8; --pink-soft: #ff7dcc;
    --green: #3aff8e; --line: rgba(255, 58, 184, 0.34); --line-hi: rgba(255, 58, 184, 0.82);
  }
  body { background: var(--bg); color: var(--ink); font-family: 'Courier New', monospace; overflow-x: hidden; }

  .cube-bg {
    position: fixed; inset: 0; width: 100%; height: 100%; border: 0;
    transform: scale(1.5); transform-origin: center; pointer-events: none; z-index: 0;
  }
  .scrim {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(circle at 50% 34%, rgba(3, 3, 5, 0.14), rgba(3, 3, 5, 0.74) 60%, rgba(3, 3, 5, 0.95) 100%),
      linear-gradient(0deg, rgba(3, 3, 5, 0.6), rgba(3, 3, 5, 0.3));
  }

  .wrap {
    position: relative; z-index: 2; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 44px 20px; text-align: center;
  }
  .eyebrow {
    font-size: clamp(12px, 2.4vw, 17px); font-weight: 800; letter-spacing: clamp(3px, 1vw, 9px);
    color: var(--pink-soft); text-transform: uppercase; text-shadow: 0 0 14px rgba(255, 58, 184, 0.5);
  }
  .blockword {
    font-family: 'NormiesFont', 'Courier New', monospace;
    font-size: clamp(48px, 12vw, 128px); font-weight: 800; letter-spacing: clamp(4px, 1.3vw, 15px);
    color: #fff; line-height: 0.9; margin-top: -4px;
    text-shadow: 0 0 28px rgba(255, 58, 184, 0.65), 0 0 70px rgba(255, 58, 184, 0.35);
  }
  .lead { font-size: clamp(13px, 2.5vw, 17px); color: var(--ink); letter-spacing: 1px; max-width: 460px; line-height: 1.5; }

  /* ---- controls ---- */
  .panel {
    width: min(560px, 92vw); display: flex; flex-direction: column; gap: 14px; margin-top: 6px;
  }
  .cta {
    font-family: inherit; cursor: pointer; color: #fff;
    font-size: clamp(14px, 2.2vw, 18px); font-weight: 800; letter-spacing: 3px;
    padding: 16px 30px; background: rgba(255, 58, 184, 0.16); border: 2px solid var(--line-hi);
    box-shadow: 0 0 22px rgba(255, 58, 184, 0.28), inset 0 0 22px rgba(255, 58, 184, 0.08);
    transition: box-shadow .18s, background .18s, transform .18s;
  }
  .cta:hover { background: rgba(255, 58, 184, 0.26); box-shadow: 0 0 30px rgba(255, 58, 184, 0.45), inset 0 0 22px rgba(255, 58, 184, 0.12); }
  .cta:active { transform: translateY(1px); }
  .connect { width: 100%; }
  .connect.connected { border-color: rgba(58, 255, 142, 0.7); box-shadow: 0 0 22px rgba(58, 255, 142, 0.25), inset 0 0 22px rgba(58, 255, 142, 0.06); background: rgba(58, 255, 142, 0.12); }

  .divider { display: flex; align-items: center; gap: 12px; color: rgba(200, 200, 204, 0.5); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
  .divider::before, .divider::after { content: ''; height: 1px; flex: 1; background: rgba(255, 255, 255, 0.12); }

  .searchrow { display: flex; gap: 10px; }
  .addr-input {
    flex: 1 1 auto; min-width: 0; padding: 15px 16px; font-family: 'Courier New', monospace;
    font-size: clamp(13px, 2vw, 16px); color: #fff; letter-spacing: 0.5px;
    background: rgba(3, 3, 5, 0.6); border: 1.5px solid var(--line); outline: none;
    transition: border-color .16s, box-shadow .16s;
  }
  .addr-input::placeholder { color: rgba(200, 200, 204, 0.4); letter-spacing: 0.5px; }
  .addr-input:focus { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink), 0 0 16px rgba(255, 58, 184, 0.4); }
  .go { flex: 0 0 auto; padding: 15px 28px; }

  /* ---- result ---- */
  .result {
    width: min(560px, 92vw); margin-top: 8px; padding: 26px 24px;
    border: 2px solid rgba(255, 255, 255, 0.14); background: rgba(3, 3, 5, 0.62);
    backdrop-filter: blur(4px); display: none; flex-direction: column; gap: 12px;
  }
  .result.show { display: flex; }
  .result-title { font-size: clamp(19px, 3.2vw, 27px); font-weight: 800; line-height: 1.3; color: #fff; }
  .result-sub { font-size: clamp(14px, 2.2vw, 18px); color: var(--pink-soft); letter-spacing: 0.5px; }
  .result-sub a { color: #fff; text-decoration: none; border-bottom: 1px solid var(--pink); }
  .result-sub a:hover { color: var(--pink-soft); }
  .result-addr { font-size: clamp(15px, 2.6vw, 21px); color: rgba(220, 220, 226, 0.82); word-break: break-all; letter-spacing: 0.5px; }

  .result.gtd  { border-color: rgba(58, 255, 142, 0.6);  box-shadow: 0 0 40px rgba(58, 255, 142, 0.22); }
  .result.gtd  .result-title { text-shadow: 0 0 22px rgba(58, 255, 142, 0.55); }
  .result.gtd  .result-sub { color: #b8ffd6; }
  .result.gtd  .result-sub a { border-bottom-color: var(--green); }
  .result.fcfs { border-color: var(--line-hi); box-shadow: 0 0 40px rgba(255, 58, 184, 0.22); }
  .result.fcfs .result-title { text-shadow: 0 0 22px rgba(255, 58, 184, 0.5); }
  .result.none { border-color: rgba(255, 255, 255, 0.16); box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); }
  .result.none .result-title { color: var(--ink); }
  .result.loading .result-title { color: var(--pink-soft); }

  .reset { width: min(560px, 92vw); display: none; margin-top: 2px; }

  /* ---- invalid popup ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: rgba(3, 3, 5, 0.72); backdrop-filter: blur(3px); padding: 20px;
  }
  .overlay.show { display: flex; }
  .popup {
    width: min(400px, 92vw); padding: 30px 26px; text-align: center;
    background: #0b0b10; border: 2px solid var(--line-hi);
    box-shadow: 0 0 40px rgba(255, 58, 184, 0.4); display: flex; flex-direction: column; gap: 14px;
  }
  .popup-title { font-size: 22px; font-weight: 800; color: #fff; text-shadow: 0 0 18px rgba(255, 58, 184, 0.5); }
  .popup-msg { font-size: 14px; color: var(--ink); line-height: 1.5; }
  .popup .cta { align-self: center; padding: 12px 34px; font-size: 15px; }
</style>
</head>
<body>
  <iframe class="cube-bg" src="/cube-bg.html" title="" scrolling="no" tabindex="-1" aria-hidden="true"></iframe>
  <div class="scrim"></div>

  <div class="wrap">
    <div class="eyebrow">Allowlist Checker</div>
    <h1 class="blockword">BLOCKS</h1>
    <p class="lead">Connect your wallet or paste an address to check your allowlist status.</p>

    <div class="panel" id="panel">
      <button class="cta connect" id="connect">CONNECT WALLET</button>
      <div class="divider">or</div>
      <div class="searchrow">
        <input class="addr-input" id="addr" type="text" spellcheck="false" autocomplete="off"
               placeholder="Paste an ETH address (0x…)" />
        <button class="cta go" id="go">GO</button>
      </div>
    </div>

    <div class="result" id="result">
      <div class="result-title" id="result-title"></div>
      <div class="result-sub" id="result-sub"></div>
      <div class="result-addr" id="result-addr"></div>
    </div>

    <button class="cta reset" id="reset">CHECK ANOTHER WALLET</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="popup">
      <div class="popup-title">Invalid ETH address</div>
      <div class="popup-msg">An Ethereum address must start with <b>0x</b> and be <b>42 characters</b> long. Please check and try again.</div>
      <button class="cta" id="popup-ok">OK</button>
    </div>
  </div>

<script>
  var FOLLOW = 'Follow <a href="https://x.com/bright_lightart" target="_blank" rel="noopener">@bright_lightart</a> for info &amp; drop timings';
  var addr = document.getElementById('addr');
  var result = document.getElementById('result');
  var rTitle = document.getElementById('result-title');
  var rSub = document.getElementById('result-sub');
  var rAddr = document.getElementById('result-addr');
  var overlay = document.getElementById('overlay');
  var connectBtn = document.getElementById('connect');
  var panel = document.getElementById('panel');
  var resetBtn = document.getElementById('reset');

  function isValid(s) { return /^0x[0-9a-fA-F]{40}$/.test((s || '').trim()); }

  function showPopup() { overlay.classList.add('show'); }
  function hidePopup() { overlay.classList.remove('show'); }
  document.getElementById('popup-ok').onclick = hidePopup;
  overlay.onclick = function (e) { if (e.target === overlay) hidePopup(); };

  function render(tier, address) {
    if (tier === 'loading') {
      result.className = 'result show loading';
      rTitle.textContent = 'Checking…'; rSub.innerHTML = ''; rAddr.textContent = '';
      panel.style.display = 'none'; resetBtn.style.display = 'none';
      return;
    }
    result.className = 'result show ' + (tier || 'none');
    rAddr.textContent = address ? address : '';
    if (tier === 'gtd') {
      rTitle.textContent = 'Eligible for guaranteed spots';
      rSub.innerHTML = FOLLOW;
    } else if (tier === 'fcfs') {
      rTitle.textContent = 'Eligible for FCFS list';
      rSub.innerHTML = FOLLOW;
    } else {
      rTitle.textContent = 'Not Eligible :(';
      rSub.innerHTML = '';
    }
    // A result is showing → collapse the search controls, offer "check another".
    panel.style.display = 'none'; resetBtn.style.display = 'block';
  }

  // Reset back to the search view: clear input, result, and the connected state.
  function showSearchMode() {
    result.className = 'result'; resetBtn.style.display = 'none';
    panel.style.display = 'flex';
    addr.value = '';
    connectBtn.classList.remove('connected'); connectBtn.textContent = 'CONNECT WALLET';
    addr.focus();
  }
  resetBtn.onclick = showSearchMode;

  // On a network/server error, show a neutral retry message — never a guessed tier.
  function renderError(address) {
    result.className = 'result show none';
    rTitle.textContent = 'Couldn’t check right now — please try again.';
    rSub.innerHTML = ''; rAddr.textContent = address || '';
    panel.style.display = 'none'; resetBtn.style.display = 'block';
  }

  async function check(address) {
    var a = (address || '').trim();
    if (!isValid(a)) { showPopup(); return; }
    render('loading');
    try {
      var r = await fetch('/api/allowlist-check?wallet=' + a);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var j = await r.json();
      render(j.tier, a);
    } catch (e) {
      renderError(a);
    }
  }

  document.getElementById('go').onclick = function () { check(addr.value); };
  addr.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(addr.value); });

  connectBtn.onclick = async function () {
    if (!window.ethereum) { addr.focus(); showPopupNoWallet(); return; }
    try {
      var accts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      if (accts && accts[0]) {
        connectBtn.classList.add('connected');
        connectBtn.textContent = accts[0].slice(0, 6) + '…' + accts[0].slice(-4);
        addr.value = accts[0];
        check(accts[0]);
      }
    } catch (e) { /* user rejected */ }
  };
  function showPopupNoWallet() {
    document.querySelector('.popup-title').textContent = 'No wallet detected';
    document.querySelector('.popup-msg').innerHTML = 'No browser wallet found. Install MetaMask / Rabby, or paste your address into the box.';
    showPopup();
  }

  // ?state=gtd|fcfs|none|invalid — force a panel for visual review.
  var qs = new URLSearchParams(location.search).get('state');
  if (qs === 'invalid') showPopup();
  else if (qs) render(qs, '0x1234abcd1234abcd1234abcd1234abcd1234abcd');
</script>
</body>
</html>
