  :root { --pink: #ff3ab8; --pink-soft: #ff7dcc; --pc: #ff3a4e; }
  .app { position: relative; min-height: 100vh; }

  /* Live zoomed-in Normie #1252 cube as the background (same as the site). */
  .cube-bg {
    position: fixed; inset: 0; width: 100%; height: 100%; border: 0;
    transform: scale(1.5); transform-origin: center; pointer-events: none; z-index: 0;
  }
  .scrim {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(circle at 50% 40%, rgba(3, 3, 5, 0.18), rgba(3, 3, 5, 0.72) 62%, rgba(3, 3, 5, 0.94) 100%),
      linear-gradient(0deg, rgba(3, 3, 5, 0.55), rgba(3, 3, 5, 0.25));
  }

  .hero {
    position: relative; z-index: 2; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 30px; padding: 48px 20px; text-align: center;
  }
  .blockword {
    font-family: 'NormiesFont', 'Courier New', monospace;
    font-size: clamp(52px, 13vw, 150px); font-weight: 800; letter-spacing: clamp(4px, 1.4vw, 16px);
    color: #fff; line-height: 0.92;
    text-shadow: 0 0 28px rgba(255, 58, 184, 0.65), 0 0 70px rgba(255, 58, 184, 0.35);
  }

  /* 9-plane slideshow — the post-registration flourish. */
  .planebox {
    width: min(360px, 74vw); aspect-ratio: 1; padding: 16px; overflow: visible;
    border: 2px solid rgba(255, 255, 255, 0.16);
    background: rgba(3, 3, 5, 0.5); backdrop-filter: blur(4px);
    box-shadow: 0 0 44px rgba(0, 0, 0, 0.6);
    display: flex; align-items: center; justify-content: center;
  }
  .plane {
    width: 100%; height: 100%; display: block; object-fit: contain;
    filter: drop-shadow(0 0 20px var(--pc)); transition: filter .16s ease;
  }

  .closed-msg {
    max-width: 760px; font-family: 'Courier New', monospace;
    font-size: clamp(19px, 3.3vw, 30px); font-weight: 700; line-height: 1.5;
    color: #fff; letter-spacing: 1px; text-shadow: 0 0 18px rgba(255, 58, 184, 0.4);
  }
  .spacer { height: 6px; }
  .follow-line {
    font-family: 'Courier New', monospace;
    font-size: clamp(16px, 2.6vw, 22px); color: var(--pink-soft);
    letter-spacing: 1px; text-shadow: 0 0 14px rgba(255, 58, 184, 0.45);
  }
  .follow-line a { color: #fff; text-decoration: none; border-bottom: 1px solid var(--pink); }
  .follow-line a:hover { color: var(--pink-soft); }
</style>
</head>
<body>
<div class="app">
  <iframe class="cube-bg" src="/cube-bg.html" title="" scrolling="no" tabindex="-1" aria-hidden="true"></iframe>
  <div class="scrim"></div>
  <div class="hero">
    <h1 class="blockword">THE BLOCK</h1>
    <div class="planebox" id="planebox"><img class="plane" id="plane" src="/planes/plane-1.svg" alt="" /></div>
    <p class="closed-msg">Allowlist registrations are now closed. Applications are being processed.</p>
    <div class="spacer"></div>
    <p class="follow-line">Follow <a href="https://x.com/bright_lightart" target="_blank" rel="noopener">@bright_lightart</a> on X for info</p>
  </div>
</div>
<script>
  var PLANES = Array.from({ length: 9 }, function (_, i) { return '/planes/plane-' + (i + 1) + '.svg'; });
  var AXES = ['#ff3a4e', '#3a7bff', '#3aff8e'];
  var img = document.getElementById('plane');
  var box = document.getElementById('planebox');
  var i = 0;
  PLANES.forEach(function (src) { var p = new Image(); p.src = src; }); // preload
  box.style.setProperty('--pc', AXES[0]);
  setInterval(function () {
    i++;
    img.src = PLANES[i % PLANES.length];
    box.style.setProperty('--pc', AXES[i % AXES.length]);
  }, 620);
</script>
</body>
</html>
