<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blockcassone Onchain Token Prototype</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040404;
      color: #f2f2f2;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .hud {
      position: fixed;
      left: 14px;
      bottom: 12px;
      color: rgba(255, 255, 255, 0.72);
      pointer-events: none;
      text-shadow: 0 1px 5px #000;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud" id="hud"></div>

  <script>
  (() => {
    "use strict";

    const TOKEN = {
      tokenId: 1,
      slot: 1734,
      hilbertOrder: 5,
      regionOrder: 2,
      neighbourhoodOrder: 3,
      streetOrder: 4,
      sourceKind: 2,
      sourceContract: "0x1234567890abcdef1234567890abcdef12345678",
      sourceTokenId: "42",
      payloadVersion: 1,
      payloadHex: ""
    };

    const canvas = document.getElementById("c");
    const hud = document.getElementById("hud");
    const gl = canvas.getContext("webgl", {
      alpha: false,
      antialias: true,
      depth: true,
      premultipliedAlpha: false
    });

    if (!gl) {
      hud.textContent = "WebGL unavailable";
      return;
    }

    const GRID = 40;
    const CUBE = 1.0;
    const palette = [
      [0.02, 0.00, 0.00],
      [0.42, 0.00, 0.00],
      [0.92, 0.04, 0.02],
      [1.55, 0.16, 0.06]
    ];

    let yaw = 0.72;
    let pitch = -0.42;
    let dist = 3.25;
    let panX = 0;
    let panY = 0;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    const lineProgram = makeProgram(
      "attribute vec3 aPos;\n" +
      "attribute vec3 aCol;\n" +
      "uniform mat4 uMvp;\n" +
      "varying vec3 vCol;\n" +
      "void main(){\n" +
      "  vCol=aCol;\n" +
      "  gl_Position=uMvp*vec4(aPos,1.0);\n" +
      "}\n",
      "precision mediump float;\n" +
      "varying vec3 vCol;\n" +
      "void main(){\n" +
      "  gl_FragColor=vec4(vCol,1.0);\n" +
      "}\n"
    );

    const voxelProgram = makeProgram(
      "attribute vec3 aPos;\n" +
      "attribute vec3 aCol;\n" +
      "uniform mat4 uMvp;\n" +
      "varying vec3 vCol;\n" +
      "void main(){\n" +
      "  vCol=aCol;\n" +
      "  gl_Position=uMvp*vec4(aPos,1.0);\n" +
      "}\n",
      "precision mediump float;\n" +
      "varying vec3 vCol;\n" +
      "void main(){\n" +
      "  gl_FragColor=vec4(vCol,0.42);\n" +
      "}\n"
    );

    const bands = decodeBands(TOKEN.payloadHex || makeSamplePayloadHex(TOKEN.slot));
    const lineMesh = makeLineMesh(buildLines(bands));
    const voxelMesh = makeTriangleMesh(buildVoxels(bands));

    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    canvas.addEventListener("pointerdown", ev => {
      dragging = true;
      lastX = ev.clientX;
      lastY = ev.clientY;
      canvas.setPointerCapture(ev.pointerId);
    });

    canvas.addEventListener("pointerup", ev => {
      dragging = false;
      canvas.releasePointerCapture(ev.pointerId);
    });

    canvas.addEventListener("pointermove", ev => {
      if (!dragging) return;
      const dx = ev.clientX - lastX;
      const dy = ev.clientY - lastY;
      lastX = ev.clientX;
      lastY = ev.clientY;
      if (ev.buttons === 2) {
        panX += dx * 0.002;
        panY -= dy * 0.002;
      } else {
        yaw += dx * 0.007;
        pitch = clamp(pitch + dy * 0.006, -1.35, 1.35);
      }
    });

    canvas.addEventListener("contextmenu", ev => ev.preventDefault());
    canvas.addEventListener("wheel", ev => {
      ev.preventDefault();
      dist = clamp(dist * Math.exp(ev.deltaY * 0.0012), 1.6, 7.0);
    }, { passive: false });

    canvas.addEventListener("dblclick", () => {
      yaw = 0.72;
      pitch = -0.42;
      dist = 3.25;
      panX = 0;
      panY = 0;
    });

    requestAnimationFrame(frame);

    function frame(tMs) {
      resize();
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0.012, 0.012, 0.013, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      const t = tMs * 0.001;
      const aspect = canvas.width / Math.max(1, canvas.height);
      const proj = perspective(48 * Math.PI / 180, aspect, 0.05, 50);
      const eye = [
        Math.sin(yaw) * Math.cos(pitch) * dist + panX,
        Math.sin(pitch) * dist + panY,
        Math.cos(yaw) * Math.cos(pitch) * dist
      ];
      const view = lookAt(eye, [panX, panY, 0], [0, 1, 0]);
      const mvp = mul4(proj, view);

      drawTriangles(voxelMesh, voxelProgram, mvp);
      drawLines(lineMesh, lineProgram, mvp);

      hud.textContent =
        "cube #" + TOKEN.tokenId +
        " | slot " + TOKEN.slot +
        " | region " + regionIndex(TOKEN.slot, TOKEN.regionOrder) +
        " | neighbourhood " + regionIndex(TOKEN.slot, TOKEN.neighbourhoodOrder) +
        " | street " + regionIndex(TOKEN.slot, TOKEN.streetOrder) +
        " | drag orbit / wheel zoom / double-click reset";

      requestAnimationFrame(frame);
    }

    function buildLines(bands) {
      const out = [];
      addCubeEdges(out);
      addHilbertPath(out);
      addContours(out, bands);
      addBanner(out);
      return out;
    }

    function addCubeEdges(out) {
      const s = CUBE;
      const v = [
        [-s,-s,-s], [ s,-s,-s], [ s, s,-s], [-s, s,-s],
        [-s,-s, s], [ s,-s, s], [ s, s, s], [-s, s, s]
      ];
      const e = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
      for (const [a,b] of e) seg(out, v[a], v[b], [0.34, 0.38, 0.42]);
    }

    function addHilbertPath(out) {
      const s = 0.76;
      const v = [
        [-s,-s,-s], [-s,-s, s], [-s, s, s], [-s, s,-s],
        [ s, s,-s], [ s, s, s], [ s,-s, s], [ s,-s,-s]
      ];
      for (let i = 0; i < v.length - 1; i++) seg(out, v[i], v[i + 1], [0.95, 0.10, 0.04]);
    }

    function addContours(out, bands) {
      const z = CUBE + 0.006;
      for (let row = 0; row < GRID; row++) {
        for (let col = 1; col < GRID; col++) {
          const a = bands[row * GRID + col - 1];
          const b = bands[row * GRID + col];
          if (a === b) continue;
          const x = mapCell(col);
          const y0 = mapCell(row);
          const y1 = mapCell(row + 1);
          seg(out, [x, y0, z], [x, y1, z], [1.25, 0.05 + b * 0.04, 0.04]);
        }
      }
      for (let row = 1; row < GRID; row++) {
        for (let col = 0; col < GRID; col++) {
          const a = bands[(row - 1) * GRID + col];
          const b = bands[row * GRID + col];
          if (a === b) continue;
          const y = mapCell(row);
          const x0 = mapCell(col);
          const x1 = mapCell(col + 1);
          seg(out, [x0, y, z], [x1, y, z], [1.25, 0.05 + b * 0.04, 0.04]);
        }
      }
    }

    function addBanner(out) {
      const z = -CUBE - 0.04;
      const y = -0.98;
      const left = -0.82;
      const step = 0.042;
      const hex = TOKEN.sourceContract.slice(2, 34);
      for (let i = 0; i < hex.length; i++) {
        const x = left + i * step;
        const h = ((hex.charCodeAt(i) * 1103515245) >>> 0) / 0xffffffff;
        seg(out, [x, y, z], [x, y + 0.16 + h * 0.12, z], [0.85, 0.85, 0.90]);
      }
    }

    function buildVoxels(bands) {
      const out = [];
      const step = 2 / GRID;
      const half = step * 0.34;
      const depthLayers = 12;
      for (let row = 0; row < GRID; row += 2) {
        for (let col = 0; col < GRID; col += 2) {
          const band = bands[row * GRID + col];
          if (band === 0) continue;
          const x = mapCell(col + 0.5);
          const y = mapCell(row + 0.5);
          const layers = Math.max(1, band * 3);
          for (let dz = 0; dz < layers; dz++) {
            if (((row * 17 + col * 31 + dz * 7 + TOKEN.slot) % 5) === 0) continue;
            const z = CUBE - (dz + 1) * (1.55 / depthLayers);
            const c = palette[band].map(v => v * (0.56 + dz * 0.035));
            cube(out, [x, y, z], half, c);
          }
        }
      }
      return out;
    }

    function cube(out, p, h, c) {
      const [x,y,z] = p;
      const v = [
        [x-h,y-h,z-h], [x+h,y-h,z-h], [x+h,y+h,z-h], [x-h,y+h,z-h],
        [x-h,y-h,z+h], [x+h,y-h,z+h], [x+h,y+h,z+h], [x-h,y+h,z+h]
      ];
      const f = [[0,1,2,0,2,3],[4,6,5,4,7,6],[0,4,5,0,5,1],[1,5,6,1,6,2],[2,6,7,2,7,3],[3,7,4,3,4,0]];
      for (const face of f) for (const idx of face) pushVertex(out, v[idx], c);
    }

    function makeSamplePayloadHex(seed) {
      let hex = "";
      for (let i = 0; i < 400; i++) {
        const c0 = sampleBand(i * 4 + 0, seed);
        const c1 = sampleBand(i * 4 + 1, seed);
        const c2 = sampleBand(i * 4 + 2, seed);
        const c3 = sampleBand(i * 4 + 3, seed);
        const b = c0 | (c1 << 2) | (c2 << 4) | (c3 << 6);
        hex += b.toString(16).padStart(2, "0");
      }
      return hex;
    }

    function sampleBand(i, seed) {
      const x = (i % GRID) - 19.5;
      const y = Math.floor(i / GRID) - 19.5;
      const r = Math.sqrt(x * x + y * y);
      const a = Math.atan2(y, x);
      const wave = Math.sin(r * 0.45 + seed * 0.013) + Math.cos(a * 5 + r * 0.18);
      if (r > 18.2) return 0;
      if (wave > 1.00) return 3;
      if (wave > 0.15) return 2;
      if (wave > -0.65) return 1;
      return 0;
    }

    function decodeBands(hex) {
      const clean = hex.replace(/^0x/, "");
      const out = new Uint8Array(GRID * GRID);
      for (let i = 0; i < 400; i++) {
        const b = parseInt(clean.slice(i * 2, i * 2 + 2) || "00", 16);
        out[i * 4 + 0] = b & 3;
        out[i * 4 + 1] = (b >> 2) & 3;
        out[i * 4 + 2] = (b >> 4) & 3;
        out[i * 4 + 3] = (b >> 6) & 3;
      }
      return out;
    }

    function mapCell(v) {
      return (v / GRID) * 2 - 1;
    }

    function seg(out, a, b, c) {
      pushVertex(out, a, c);
      pushVertex(out, b, c);
    }

    function pushVertex(out, p, c) {
      out.push(p[0], p[1], p[2], c[0], c[1], c[2]);
    }

    function makeLineMesh(data) {
      return makeMesh(data, gl.LINES);
    }

    function makeTriangleMesh(data) {
      return makeMesh(data, gl.TRIANGLES);
    }

    function makeMesh(data, mode) {
      const buffer = gl.createBuffer();
      const array = new Float32Array(data);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, array, gl.STATIC_DRAW);
      return { buffer, count: array.length / 6, mode };
    }

    function drawLines(mesh, program, mvp) {
      gl.disable(gl.BLEND);
      drawMesh(mesh, program, mvp);
      gl.enable(gl.BLEND);
    }

    function drawTriangles(mesh, program, mvp) {
      gl.depthMask(false);
      drawMesh(mesh, program, mvp);
      gl.depthMask(true);
    }

    function drawMesh(mesh, program, mvp) {
      gl.useProgram(program.p);
      gl.uniformMatrix4fv(program.uMvp, false, mvp);
      gl.bindBuffer(gl.ARRAY_BUFFER, mesh.buffer);
      gl.enableVertexAttribArray(program.aPos);
      gl.enableVertexAttribArray(program.aCol);
      gl.vertexAttribPointer(program.aPos, 3, gl.FLOAT, false, 24, 0);
      gl.vertexAttribPointer(program.aCol, 3, gl.FLOAT, false, 24, 12);
      gl.drawArrays(mesh.mode, 0, mesh.count);
    }

    function makeProgram(vs, fs) {
      const p = gl.createProgram();
      gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
      gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      return {
        p,
        aPos: gl.getAttribLocation(p, "aPos"),
        aCol: gl.getAttribLocation(p, "aCol"),
        uMvp: gl.getUniformLocation(p, "uMvp")
      };
    }

    function shader(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = Math.floor(canvas.clientWidth * dpr);
      const h = Math.floor(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
    }

    function perspective(fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2);
      const nf = 1 / (near - far);
      return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, 2 * far * near * nf, 0
      ]);
    }

    function lookAt(eye, center, up) {
      const z = norm(sub(eye, center));
      const x = norm(cross(up, z));
      const y = cross(z, x);
      return new Float32Array([
        x[0], y[0], z[0], 0,
        x[1], y[1], z[1], 0,
        x[2], y[2], z[2], 0,
        -dot(x, eye), -dot(y, eye), -dot(z, eye), 1
      ]);
    }

    function mul4(a, b) {
      const out = new Float32Array(16);
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
          out[i * 4 + j] =
            a[i * 4 + 0] * b[0 * 4 + j] +
            a[i * 4 + 1] * b[1 * 4 + j] +
            a[i * 4 + 2] * b[2 * 4 + j] +
            a[i * 4 + 3] * b[3 * 4 + j];
        }
      }
      return out;
    }

    function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    function cross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]
      ];
    }
    function norm(v) {
      const l = Math.hypot(v[0], v[1], v[2]) || 1;
      return [v[0] / l, v[1] / l, v[2] / l];
    }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function regionIndex(slot, order) {
      const block = Math.pow(8, TOKEN.hilbertOrder - order);
      return Math.floor(slot / block);
    }
  })();
  </script>
</body>
</html>
