<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blockcassone Onchain Normie Token Prototype</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020203;
      color: #ffd4f1;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    .hud {
      position: fixed;
      left: 16px;
      bottom: 14px;
      max-width: min(620px, calc(100vw - 32px));
      padding: 10px 12px;
      border: 2px solid rgba(255, 58, 184, .66);
      background: rgba(6, 2, 8, .72);
      color: #ff9bdd;
      text-shadow: 0 0 12px rgba(255, 58, 184, .58);
      box-shadow: 0 0 22px rgba(255, 58, 184, .2), inset 0 0 20px rgba(255, 58, 184, .08);
      pointer-events: none;
      white-space: pre-line;
    }
    .error { color: #ff7b7b; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud" id="hud">loading</div>

  <script>
  (() => {
    "use strict";

    const TOKEN = {
      tokenId: 1,
      slot: 1734,
      sourceContract: "0x9Eb6E2025B64f340691e424b7fe7022fFDE12438",
      sourceTokenId: 6722,
      agentic: false,
      agentId: 0,
      rawImageData: ""
    };

    const GRID = 40;
    const PIXELS = GRID * GRID;
    const RAW_BYTES = PIXELS / 8;
    const QS = new URLSearchParams(location.search);
    const canvas = document.getElementById("c");
    const hud = document.getElementById("hud");
    const gl = canvas.getContext("webgl", {
      alpha: false,
      antialias: true,
      depth: true,
      premultipliedAlpha: false
    });

    if (!gl) {
      hud.textContent = "WebGL unavailable";
      hud.classList.add("error");
      return;
    }

    let yaw = 0.78;
    let pitch = -0.36;
    let distance = 3.35;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    const program = makeProgram(
      "attribute vec3 p;attribute vec3 c;uniform mat4 m;varying vec3 v;void main(){v=c;gl_Position=m*vec4(p,1.0);}",
      "precision mediump float;varying vec3 v;void main(){gl_FragColor=vec4(v,1.0);}"
    );

    const pointProgram = makeProgram(
      "attribute vec3 p;attribute vec3 c;uniform mat4 m;uniform float s;varying vec3 v;void main(){v=c;gl_Position=m*vec4(p,1.0);gl_PointSize=s;}",
      "precision mediump float;varying vec3 v;void main(){vec2 d=gl_PointCoord-.5;float a=smoothstep(.25,.02,dot(d,d));gl_FragColor=vec4(v,a);}"
    );

    let lineMesh = null;
    let pointMesh = null;
    let pixels = null;
    let rawHex = "";
    let sourceLabel = "sample packed Normie bytes";

    setupInput();
    loadTokenData().then(start).catch(err => {
      hud.textContent = String(err && err.message || err);
      hud.classList.add("error");
    });

    async function loadTokenData() {
      TOKEN.slot = intParam("slot", TOKEN.slot);
      TOKEN.tokenId = intParam("token", TOKEN.tokenId);
      TOKEN.sourceTokenId = intParam("normie", TOKEN.sourceTokenId);

      rawHex = normalizeHex(QS.get("raw") || TOKEN.rawImageData);
      if (rawHex) {
        sourceLabel = "raw query payload";
        return;
      }

      if (QS.has("api")) {
        sourceLabel = "dev API packed preview";
        const id = TOKEN.sourceTokenId;
        const res = await fetch(`/api/normies/normie/${id}/pixels`);
        if (!res.ok) throw new Error(`Normies dev API ${res.status} for ${id}`);
        const text = (await res.text()).replace(/\s/g, "");
        rawHex = packApiPixelsMsb(text);
        return;
      }

      rawHex = sampleNormieRawHex(TOKEN.sourceTokenId);
    }

    function start() {
      pixels = decodePackedBitmap(rawHex);
      lineMesh = mesh(gl.LINES, buildLineVertices(pixels));
      pointMesh = mesh(gl.POINTS, buildPointVertices(pixels));
      gl.enable(gl.DEPTH_TEST);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      requestAnimationFrame(frame);
    }

    function frame(ms) {
      resize();
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0.006, 0.006, 0.008, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      const aspect = canvas.width / Math.max(1, canvas.height);
      const proj = perspective(Math.PI / 4.15, aspect, .04, 50);
      const eye = [
        Math.sin(yaw) * Math.cos(pitch) * distance,
        Math.sin(pitch) * distance,
        Math.cos(yaw) * Math.cos(pitch) * distance
      ];
      const view = lookAt(eye, [0, 0, 0], [0, 1, 0]);
      const mvp = mul4(proj, view);

      draw(lineMesh, program, mvp);
      drawPoints(pointMesh, pointProgram, mvp, Math.max(2.2, Math.min(5.5, canvas.width / 360)));

      const on = pixels.reduce((sum, v) => sum + v, 0);
      hud.textContent =
        `Blockcassone Cube #${TOKEN.tokenId}\n` +
        `Normie #${TOKEN.sourceTokenId} | plot ${TOKEN.slot} | region ${Math.floor(TOKEN.slot / 512)} | neighbourhood ${Math.floor(TOKEN.slot / 64)} | street ${Math.floor(TOKEN.slot / 8)}\n` +
        `${sourceLabel} | ${rawHex.length / 2} bytes | ${on}/${PIXELS} lit pixels\n` +
        "drag orbit | wheel zoom | double-click reset | add ?api&normie=6722 to compare dev API pixels";

      requestAnimationFrame(frame);
    }

    function buildLineVertices(pix) {
      const out = [];
      cubeEdges(out);
      hilbertGlyph(out);
      bitmapContours(out, pix, "front");
      bitmapContours(out, pix, "right");
      bitmapContours(out, pix, "top");
      sourceBanner(out);
      return out;
    }

    function buildPointVertices(pix) {
      const out = [];
      const layers = 18;
      for (let row = 0; row < GRID; row++) {
        for (let col = 0; col < GRID; col++) {
          if (!pix[row * GRID + col]) continue;
          const x = cell(col + .5);
          const y = -cell(row + .5);
          const depth = 4 + ((row * 19 + col * 23 + TOKEN.sourceTokenId) % layers);
          for (let zStep = 0; zStep < depth; zStep += 3) {
            const z = .96 - zStep * (1.84 / layers);
            const glow = .55 + zStep / layers;
            vert(out, [x, y, z], [1.2 * glow, .06, .04 + .05 * glow]);
          }
        }
      }
      return out;
    }

    function bitmapContours(out, pix, side) {
      for (let row = 0; row < GRID; row++) {
        for (let col = 0; col < GRID; col++) {
          const here = pix[row * GRID + col];
          if (!here) continue;
          if (!get(pix, row - 1, col)) contourSeg(out, side, row, col, row, col + 1);
          if (!get(pix, row + 1, col)) contourSeg(out, side, row + 1, col, row + 1, col + 1);
          if (!get(pix, row, col - 1)) contourSeg(out, side, row, col, row + 1, col);
          if (!get(pix, row, col + 1)) contourSeg(out, side, row, col + 1, row + 1, col + 1);
        }
      }
    }

    function contourSeg(out, side, r0, c0, r1, c1) {
      const a = facePoint(side, r0, c0);
      const b = facePoint(side, r1, c1);
      seg(out, a, b, [1.5, .03, .05]);
      seg(out, scale(a, 1.006), scale(b, 1.006), [.86, .95, .9]);
    }

    function facePoint(side, row, col) {
      const u = cell(col);
      const v = -cell(row);
      if (side === "right") return [1.002, v, -u];
      if (side === "top") return [u, 1.002, v];
      return [u, v, 1.002];
    }

    function cubeEdges(out) {
      const s = 1.02;
      const v = [
        [-s,-s,-s], [s,-s,-s], [s,s,-s], [-s,s,-s],
        [-s,-s,s], [s,-s,s], [s,s,s], [-s,s,s]
      ];
      const e = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
      for (const [a,b] of e) seg(out, v[a], v[b], [1.1, .08, .72]);
    }

    function hilbertGlyph(out) {
      const p = [
        [-.78,-.78,-.78],[-.78,-.78,.78],[-.78,.78,.78],[-.78,.78,-.78],
        [.78,.78,-.78],[.78,.78,.78],[.78,-.78,.78],[.78,-.78,-.78]
      ];
      for (let i = 0; i < p.length - 1; i++) {
        seg(out, p[i], p[i + 1], [.08, 1.2, .12]);
        seg(out, scale(p[i], 1.01), scale(p[i + 1], 1.01), [1.4, .04, .66]);
      }
    }

    function sourceBanner(out) {
      const text = TOKEN.sourceContract.slice(2, 26).toLowerCase();
      for (let i = 0; i < text.length; i++) {
        const x = -.86 + i * .072;
        const y = -1.075;
        const z = .96;
        const h = .08 + (text.charCodeAt(i) % 7) * .026;
        seg(out, [x, y, z], [x, y + h, z], [.95, .95, 1.15]);
      }
    }

    function decodePackedBitmap(hex) {
      const clean = normalizeHex(hex);
      if (clean.length !== RAW_BYTES * 2) {
        throw new Error(`expected ${RAW_BYTES} raw bytes, got ${clean.length / 2}`);
      }
      const out = new Uint8Array(PIXELS);
      for (let i = 0; i < PIXELS; i++) {
        const byte = parseInt(clean.slice((i >> 3) * 2, (i >> 3) * 2 + 2), 16);
        out[i] = (byte >> (7 - (i & 7))) & 1;
      }
      return out;
    }

    function packApiPixelsMsb(text) {
      if (text.length !== PIXELS) throw new Error(`expected ${PIXELS} API pixels, got ${text.length}`);
      const bytes = new Uint8Array(RAW_BYTES);
      for (let i = 0; i < PIXELS; i++) {
        if (text[i] === "1") bytes[i >> 3] |= 1 << (7 - (i & 7));
      }
      return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
    }

    function sampleNormieRawHex(seed) {
      const bytes = new Uint8Array(RAW_BYTES);
      for (let i = 0; i < PIXELS; i++) {
        const x = (i % GRID) - 19.5;
        const y = Math.floor(i / GRID) - 19.5;
        const r = Math.hypot(x, y);
        const a = Math.atan2(y, x);
        const v = Math.sin(r * .5 + seed * .011) + Math.cos(a * 4 + seed * .003);
        if (r < 18.6 && v > -.12) bytes[i >> 3] |= 1 << (7 - (i & 7));
      }
      return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
    }

    function normalizeHex(value) {
      return String(value || "").trim().replace(/^0x/i, "").replace(/[^0-9a-f]/gi, "").toLowerCase();
    }

    function get(pix, row, col) {
      if (row < 0 || row >= GRID || col < 0 || col >= GRID) return 0;
      return pix[row * GRID + col];
    }

    function cell(v) { return (v / GRID) * 2 - 1; }
    function intParam(name, fallback) {
      const n = Number(QS.get(name));
      return Number.isInteger(n) ? n : fallback;
    }

    function setupInput() {
      canvas.addEventListener("pointerdown", ev => {
        dragging = true;
        lastX = ev.clientX;
        lastY = ev.clientY;
        canvas.setPointerCapture(ev.pointerId);
      });
      canvas.addEventListener("pointerup", ev => {
        dragging = false;
        canvas.releasePointerCapture(ev.pointerId);
      });
      canvas.addEventListener("pointermove", ev => {
        if (!dragging) return;
        yaw += (ev.clientX - lastX) * .007;
        pitch = clamp(pitch + (ev.clientY - lastY) * .006, -1.35, 1.35);
        lastX = ev.clientX;
        lastY = ev.clientY;
      });
      canvas.addEventListener("wheel", ev => {
        ev.preventDefault();
        distance = clamp(distance * Math.exp(ev.deltaY * .0012), 1.7, 7);
      }, { passive: false });
      canvas.addEventListener("dblclick", () => {
        yaw = .78;
        pitch = -.36;
        distance = 3.35;
      });
    }

    function mesh(mode, data) {
      const buffer = gl.createBuffer();
      const array = new Float32Array(data);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, array, gl.STATIC_DRAW);
      return { buffer, mode, count: array.length / 6 };
    }

    function draw(target, prog, mvp) {
      gl.useProgram(prog.p);
      gl.uniformMatrix4fv(prog.m, false, mvp);
      gl.bindBuffer(gl.ARRAY_BUFFER, target.buffer);
      gl.enableVertexAttribArray(prog.pLoc);
      gl.enableVertexAttribArray(prog.cLoc);
      gl.vertexAttribPointer(prog.pLoc, 3, gl.FLOAT, false, 24, 0);
      gl.vertexAttribPointer(prog.cLoc, 3, gl.FLOAT, false, 24, 12);
      gl.drawArrays(target.mode, 0, target.count);
    }

    function drawPoints(target, prog, mvp, size) {
      gl.useProgram(prog.p);
      gl.uniformMatrix4fv(prog.m, false, mvp);
      gl.uniform1f(prog.s, size);
      gl.bindBuffer(gl.ARRAY_BUFFER, target.buffer);
      gl.enableVertexAttribArray(prog.pLoc);
      gl.enableVertexAttribArray(prog.cLoc);
      gl.vertexAttribPointer(prog.pLoc, 3, gl.FLOAT, false, 24, 0);
      gl.vertexAttribPointer(prog.cLoc, 3, gl.FLOAT, false, 24, 12);
      gl.drawArrays(target.mode, 0, target.count);
    }

    function makeProgram(vs, fs) {
      const p = gl.createProgram();
      gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
      gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      return {
        p,
        pLoc: gl.getAttribLocation(p, "p"),
        cLoc: gl.getAttribLocation(p, "c"),
        m: gl.getUniformLocation(p, "m"),
        s: gl.getUniformLocation(p, "s")
      };
    }

    function shader(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = Math.floor(canvas.clientWidth * dpr);
      const h = Math.floor(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
    }

    function vert(out, p, c) { out.push(p[0], p[1], p[2], c[0], c[1], c[2]); }
    function seg(out, a, b, c) { vert(out, a, c); vert(out, b, c); }
    function scale(v, s) { return [v[0] * s, v[1] * s, v[2] * s]; }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function perspective(fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2);
      const nf = 1 / (near - far);
      return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, 2 * far * near * nf, 0
      ]);
    }

    function lookAt(eye, center, up) {
      const z = norm(sub(eye, center));
      const x = norm(cross(up, z));
      const y = cross(z, x);
      return new Float32Array([
        x[0], y[0], z[0], 0,
        x[1], y[1], z[1], 0,
        x[2], y[2], z[2], 0,
        -dot(x, eye), -dot(y, eye), -dot(z, eye), 1
      ]);
    }

    function mul4(a, b) {
      const o = new Float32Array(16);
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
          o[i * 4 + j] = a[i * 4] * b[j] + a[i * 4 + 1] * b[4 + j] + a[i * 4 + 2] * b[8 + j] + a[i * 4 + 3] * b[12 + j];
        }
      }
      return o;
    }

    function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    function cross(a, b) {
      return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    }
    function norm(v) {
      const l = Math.hypot(v[0], v[1], v[2]) || 1;
      return [v[0] / l, v[1] / l, v[2] / l];
    }
  })();
  </script>
</body>
</html>
