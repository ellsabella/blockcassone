<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; connect-src 'self' http: https:; img-src 'self' data: blob: http: https:;">
  <title>Blockcassone · Streets</title>
  <style>
    @font-face { font-family: 'NormiesFont'; src: url('/viewer/assets/NormiesFont.otf') format('opentype'); font-display: block; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #030304; color: #c8c8cc; font-family: 'Courier New', monospace; overflow: hidden; }
    button { font: 700 12px 'Courier New', monospace; background: rgba(24,24,28,0.86); border: 1px solid rgba(120,120,140,0.38); color: #d6d6dc; padding: 6px 10px; cursor: pointer; min-height: 29px; }
    button:hover:not(:disabled) { background: rgba(46,46,54,0.92); color: #fff; box-shadow: 0 0 12px rgba(255,58,184,0.18); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.active { background: rgba(72,72,88,0.95); border-color: #ff7dcc; color: #fff; box-shadow: 0 0 14px rgba(255,58,184,0.32); }

    #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
      padding: 6px 12px; height: 50px; background: linear-gradient(180deg, rgba(5,5,8,0.96), rgba(5,5,8,0.5));
      border-bottom: 2px solid rgba(255,58,184,0.22); backdrop-filter: blur(10px); }
    .brand { font-family: 'NormiesFont','Courier New',monospace; font-size: 18px; color: #fff; letter-spacing: 1px; text-shadow: 0 0 12px rgba(255,58,184,0.5); }
    .tabs { display: flex; gap: 4px; margin-left: 6px; }
    .tabs a { text-decoration: none; }
    .spacer { flex: 1; }
    #status { font-size: 11px; color: #8f8f98; min-width: 140px; text-align: right; }

    #streets { position: fixed; top: 50px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .street {
      background: rgba(12,12,16,0.72); border: 1px solid rgba(120,120,140,0.28); border-radius: 2px; padding: 10px 12px;
    }
    .street.merged { border-color: rgba(255,58,184,0.5); box-shadow: 0 0 14px rgba(255,58,184,0.14); }
    .street-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .street-title { font-size: 13px; font-weight: 800; color: #ff9ad6; letter-spacing: 1px; text-shadow: 0 0 8px rgba(255,58,184,0.3); }
    .street-meta { font-size: 11px; color: #8f8f98; }
    .street-merge { margin-left: auto; }
    .plots { display: flex; gap: 8px; flex-wrap: wrap; }
    .plot { width: 92px; }
    .plot-tile { width: 92px; height: 92px; background: #050507; border: 1px solid rgba(120,120,140,0.25); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .plot-tile img { max-width: 100%; max-height: 100%; }
    .plot-tile.vacant { border-style: dashed; color: #565660; font-size: 10px; text-align: center; }
    .plot-cap { font-size: 9px; color: #7f7f88; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .plot.theirs .plot-tile { border-color: rgba(255,140,80,0.5); }
    .merged-block { display: flex; align-items: center; gap: 14px; }
    .merged-tile { width: 120px; height: 120px; background: #050507; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .merged-tile img { max-width: 100%; max-height: 100%; }
    .merged-badge { font-size: 12px; color: #ff9ad6; font-weight: 800; }
    .eligible { font-size: 11px; color: #9affb0; }
    .ineligible { font-size: 11px; color: #ff9a9a; }

    #confirm-overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(2,2,4,0.78); backdrop-filter: blur(4px); }
    #confirm-box { background: #0c0c10; border: 1px solid #ff7dcc; border-radius: 3px; padding: 26px 30px; max-width: 460px; text-align: center; box-shadow: 0 0 40px rgba(255,58,184,0.3); }
    #confirm-box h2 { font-family: 'NormiesFont',monospace; color: #fff; font-size: 20px; margin-bottom: 12px; }
    #confirm-box p { color: #c8c8cc; font-size: 13px; line-height: 1.5; margin-bottom: 22px; }
    #confirm-actions { display: flex; gap: 12px; justify-content: center; }
    #confirm-go { background: rgba(60,18,44,0.9); border-color: #ff7dcc; color: #fff; padding: 9px 26px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="hud">
    <span class="brand">BLOCKCASSONE</span>
    <div class="tabs">
      <a href="/viewer/index.html"><button>Big Cube</button></a>
      <a href="/viewer/update.html"><button>Update Cube</button></a>
      <button class="active">Streets</button>
    </div>
    <span class="spacer"></span>
    <button id="reload">Reload</button>
    <span id="status">loading…</span>
  </div>

  <div id="streets"></div>

  <div id="confirm-overlay">
    <div id="confirm-box">
      <h2>Merge this street?</h2>
      <p id="confirm-text"></p>
      <div id="confirm-actions">
        <button id="confirm-cancel">Cancel</button>
        <button id="confirm-go">Merge · LFG</button>
      </div>
    </div>
  </div>

  <script type="module" src="./streets.js"></script>
</body>
</html>
