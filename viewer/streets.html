<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; connect-src 'self' http: https:; img-src 'self' data: blob: http: https:;">
  <title>Blockcassone · Streets</title>
  <style>
    @font-face { font-family:'NormiesFont'; src:url('/viewer/assets/NormiesFont.otf') format('opentype'); font-display:block; }
    :root{
      --bg:#040406; --panel:#0e0e13; --panel2:#15151c; --line:rgba(130,130,150,.26);
      --ink:#d3d3da; --dim:#8a8a95; --faint:#5c5c67;
      --green:#48d19a; --orange:#ff9a3c; --pink:#ff7dcc; --red:#ff5d6c; --gold:#ffcf6a;
      --mono:ui-monospace,'SFMono-Regular',Menlo,'Courier New',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    .wrap{max-width:720px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
    a{color:inherit}
    .top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(4,4,6,.92);backdrop-filter:blur(8px);z-index:5}
    .top .back{color:var(--dim);text-decoration:none;font-weight:700}
    .top h1{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:800;flex:1;text-align:center}
    #wallet-connect{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--panel2);color:var(--ink);font:700 11px var(--mono);cursor:pointer}
    #wallet-connect.connected{border-color:var(--green);color:#9affc9}
    .tabs{display:flex;gap:8px;padding:12px 14px 4px}
    .tabs button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:10px;padding:9px;font:800 12px var(--mono);cursor:pointer}
    .tabs button.on{background:#241826;border-color:var(--pink);color:#fff}
    .barrow{display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--faint);font-size:11px}
    select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:700 11px var(--mono)}
    .list{display:flex;flex-direction:column;gap:11px;padding:6px 14px 20px}
    .empty{color:var(--faint);font-size:12px;padding:24px 6px;text-align:center}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:border-color .12s,transform .06s}
    .card:hover{border-color:#33333f} .card:active{transform:translateY(1px)}
    .card.ready{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,207,106,.25)}
    .card .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-weight:800}
    .card .hd .biome{color:var(--dim);font-weight:700}
    .card .hd .count{margin-left:auto;font-size:11px;color:var(--dim)} .card .hd .count b{color:var(--ink)}
    .plots{display:flex;gap:6px}
    .plot{position:relative;flex:1;aspect-ratio:1/1;border-radius:8px;overflow:hidden;border:2px solid transparent;background:#060608;max-width:56px;display:flex;align-items:center;justify-content:center}
    .plot svg{width:100%;height:100%;display:block}
    .plot.me{border-color:var(--green)} .plot.rival{border-color:var(--red)} .plot.vac{border-style:dashed;border-color:#3a3a44;color:var(--faint);font-size:18px}
    .plot .tile{position:absolute;inset:0}
    .card .act{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12px}
    .card .act .lead{font-weight:800} .card .act .fee{margin-left:auto;color:var(--dim);font-weight:700}
    .card.ready .act .lead{color:var(--gold)} .card.locked{opacity:.6} .card.locked .act .lead{color:var(--faint)}
    .card.merged{border-color:var(--gold);cursor:default;box-shadow:0 0 0 1px rgba(255,207,106,.3),0 10px 30px rgba(255,207,106,.08);background:linear-gradient(180deg,rgba(255,207,106,.06),var(--panel))}
    .card.merged .mbadge{color:var(--gold);font-weight:700;letter-spacing:.08em}
    .mart{padding:8px 0;display:flex;justify-content:center}
    .mart svg,.mart img{width:100%;max-width:200px;height:auto;border-radius:10px}
    .m3d{width:100%;max-width:300px;aspect-ratio:1;border:0;border-radius:10px;display:block;margin:8px auto;background:#000}
    .legend{display:flex;gap:14px;justify-content:center;padding:2px 0 14px;color:var(--faint);font-size:10px}
    .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;border:2px solid;margin-right:4px;vertical-align:-1px}
    .legend .me{border-color:var(--green)} .legend .rv{border-color:var(--red)} .legend .vc{border-color:#3a3a44;border-style:dashed}

    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);opacity:0;pointer-events:none;transition:opacity .18s;z-index:20}
    .scrim.on{opacity:1;pointer-events:auto}
    .sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);z-index:21;max-height:92dvh;display:flex;flex-direction:column}
    .sheet.on{transform:translateY(0)}
    .sheet .grab{width:38px;height:4px;border-radius:99px;background:#33333c;margin:9px auto 2px;flex:0 0 auto}
    .sheet .body{overflow-y:auto;padding:8px 16px 16px}
    .dhd{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
    .dhd .t{font-weight:800;font-size:15px} .dhd .b{color:var(--dim);font-weight:700} .dhd .close{margin-left:auto;background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer}
    .detwrap{display:grid;grid-template-columns:1fr;gap:14px}
    @media(min-width:560px){.detwrap{grid-template-columns:1.3fr 1fr}}
    .dplots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .dplot{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;border:2px solid transparent;background:#060608;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .dplot svg{width:100%;height:100%} .dplot.me{border-color:var(--green)} .dplot.rival{border-color:var(--red)} .dplot.vac{border-style:dashed;border-color:#3a3a44;color:var(--faint);font-size:22px}
    .dplot .pin{position:absolute;top:3px;right:4px;font-size:9px;font-weight:800;text-shadow:0 1px 2px #000} .dplot.me .pin{color:var(--green)} .dplot.rival .pin{color:#ff8f9a}
    .loc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
    .loc .cap{color:var(--faint);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;font-weight:800}
    .loc svg{width:100%;max-width:190px;display:block;margin:0 auto} .loc .where{color:var(--dim);font-size:11px;margin-top:8px}
    .status{margin:14px 0 4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:12px;color:var(--dim)} .status b{color:var(--ink)} .status.ready{border-color:var(--gold);color:var(--gold)}
    .actions{position:sticky;bottom:0;background:var(--panel);padding:12px 0 4px;display:flex;flex-direction:column;gap:9px}
    .row{display:flex;gap:10px}
    button.act{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:11px;padding:13px;font:800 13px var(--mono);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
    button.act:active{transform:translateY(1px)} button.act:disabled{opacity:.4;cursor:not-allowed}
    button.merge{background:var(--gold);color:#241a04;border-color:var(--gold)} button.primary{background:var(--green);color:#04120c;border-color:var(--green)}
    button.ghost{color:var(--dim)} button.warn2{border-color:var(--red);color:#ff9aa4}
    .hint{color:var(--faint);font-size:10.5px;text-align:center}
    .cubegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
    .pcube{border:2px solid transparent;border-radius:10px;overflow:hidden;background:#060608;cursor:pointer;position:relative} .pcube svg{display:block;width:100%;aspect-ratio:1/1} .pcube:hover{border-color:var(--pink)}
    .pcube .lab{position:absolute;left:0;right:0;bottom:0;font-size:8px;padding:2px 4px;color:var(--ink);background:linear-gradient(transparent,rgba(0,0,0,.85));font-weight:700}
    .confirm{border:1px solid var(--orange);background:rgba(255,154,60,.08);border-radius:12px;padding:12px;margin-top:12px} .confirm h3{color:var(--orange);font-size:12px;margin-bottom:8px;letter-spacing:.05em}
    .kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--dim)} .kv b{color:var(--ink);font-weight:700} .kv .pay{color:var(--green)} .kv .cool{color:#ff9aa4}
    .strip{display:flex;gap:9px;overflow-x:auto;padding:2px 14px 8px;scrollbar-width:none} .strip::-webkit-scrollbar{display:none}
    .strip .thumb{flex:0 0 auto;width:58px;height:58px;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;position:relative;background:#060608} .strip .thumb svg{width:100%;height:100%} .strip .thumb.sel{border-color:var(--pink)}
    .strip .thumb .id{position:absolute;left:3px;bottom:2px;font-size:9px;color:#fff;text-shadow:0 1px 2px #000;font-weight:700}
    .chips{display:flex;gap:7px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none} .chips::-webkit-scrollbar{display:none}
    .fchip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:999px;padding:6px 11px;font:700 11px var(--mono);cursor:pointer;white-space:nowrap} .fchip.on{border-color:var(--pink);color:#fff;background:#241826}
    .cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;padding:4px 14px 24px}
    .cand{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel);cursor:pointer} .cand .art{aspect-ratio:1/1;background:#060608;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:22px} .cand .art svg{width:100%;height:100%} .cand:hover{border-color:var(--pink)}
    .cand .meta{padding:6px 7px;font-size:10px;color:var(--dim)} .cand .meta .b{color:var(--ink);font-weight:700} .cand .meta .fee{color:var(--green);font-weight:700}
    .cand.sel{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink)}
    .mprev{padding:2px 14px 4px} .mprev:empty{display:none}
    .mpv{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .mppane{position:relative;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#060608;aspect-ratio:1/1}
    .mptag{position:absolute;left:6px;top:5px;z-index:2;font-size:9px;font-weight:700;color:var(--ink);background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px}
    .mpfill{width:100%;height:100%} .mpfill svg,.mpfill iframe{display:block;width:100%;height:100%;border:0;background:#060608}
    .mpnote{display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint);font-size:11px;text-align:center;padding:0 8px}
    .mpbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px 2px} .mpbar .mplabel{font-size:12px;color:var(--dim)} .mpbar .mplabel b{color:var(--ink)} .mpbar .mphint{font-size:11px;color:var(--faint)}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--green);color:#04120c;font-weight:800;padding:11px 18px;border-radius:11px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;font-size:12px;max-width:88vw;text-align:center} .toast.on{opacity:1;transform:translate(-50%,0)} .toast.err{background:var(--red);color:#fff} .toast.gold{background:var(--gold);color:#241a04}
    .gate{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:40px} .gate .big{font-size:40px} .gate p{color:var(--dim);max-width:300px} .gate a{color:var(--pink);text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="app" style="display:flex;flex-direction:column;flex:1">
      <div class="top">
        <a href="/viewer/index.html" class="back">‹ Big Cube</a>
        <h1>Streets</h1>
        <div id="wallet-connect" data-wallet-widget></div>
      </div>
      <div class="tabs">
        <button class="on" data-mode="mine">My streets</button>
        <button data-mode="move">Move a cube</button>
      </div>
      <div id="view" style="flex:1"></div>
    </div>
    <div class="gate" id="gate">
      <div class="big">🚫</div>
      <h1 style="letter-spacing:.1em;color:var(--ink)">Streets are closed</h1>
      <p>Moving and merging are paused right now (both <b style="color:var(--ink)">movesEnabled</b> and <b style="color:var(--ink)">mergesEnabled</b> are off on-chain). This page opens when they do.</p>
      <a href="/viewer/index.html">‹ Back to the Big Cube</a>
    </div>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><div class="body" id="sheetbody"></div></div>
  <div class="toast" id="toast"></div>
  <script src="/viewer/vendor/wallet-widget.js?v=20260806-1"></script>
  <script type="module" src="./streets.js?v=20260806-1"></script>
  <script type="module" src="./nav-gate.js?v=20260806-1"></script>
</body>
</html>
