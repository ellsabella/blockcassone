    /* Load-fade: pulsing label so the post-ENTER build reads as intentional
       loading, not a hang (suppressed when the watchdog shows an error). */
    #load-fade::after {
      content: 'ENTERING THE BLOCK';
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font: 700 13px 'Courier New', monospace; letter-spacing: 0.18em;
      color: #ff9adb; text-shadow: 0 0 12px rgba(255, 58, 184, 0.6);
      animation: loadPulse 1.2s ease-in-out infinite;
    }
    #load-fade.done::after, #load-fade[data-err]::after { display: none; }
    @keyframes loadPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    /* Current-view label, centred in the header — same aesthetic as the nav links:

    #view-label {

      left: 50%; top: 50%; transform: translate(-50%, -50%);
      font-family: 'NormiesFont', 'Courier New', monospace;
      font-size: 22px; letter-spacing: 0.04em; white-space: nowrap;
      color: #fff;
      text-shadow: 0 0 6px rgba(255, 58, 184, 0.9), 0 0 22px rgba(255, 58, 184, 0.6), 0 0 46px rgba(255, 58, 184, 0.3);
      pointer-events: none;
    }
    /* Load fade — solid overlay held until the DEFAULT NEIGHBOURHOOD VIEW has
       actually rendered (main.js adds .done after the focused scene draws, with
       a hard timeout so it can never trap the user). The empty full-block state
       is never visible. */
    #load-fade {
      position: fixed; inset: 0; z-index: 60; background: #020203;
      pointer-events: none;
    }
    #load-fade.done {
      opacity: 0; visibility: hidden;
      transition: opacity 1.1s ease, visibility 0s linear 1.1s;

  <script>
    // Independent load-fade watchdog: main.js releases the fade when the scene is
    // ready, but if the module NEVER evaluates (shader failure, import 404, old
    // mobile Safari choking on modern syntax) the page used to stay black forever.
    // This inline script cannot be taken down by module failures.
    (function () {
      var released = false;
      function releaseWithMessage(msg) {
        if (released) return; released = true;
        var f = document.getElementById('load-fade');
        if (!f) return;
        if (msg) {
          f.setAttribute('data-err', '1');
          f.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ff9adb;font:700 14px monospace;text-align:center;padding:24px;white-space:pre-wrap">' + msg + '</div>';
          f.style.pointerEvents = 'auto';
        } else {
          f.classList.add('done');
        }
      }
      setTimeout(function () {
        // If main.js already released it, this is a no-op (class present).
        var f = document.getElementById('load-fade');
        if (f && !f.classList.contains('done')) releaseWithMessage('');
      }, 8000);
      window.addEventListener('error', function (e) {
        var f = document.getElementById('load-fade');
        if (f && !f.classList.contains('done') && e && e.message) {
          releaseWithMessage('TheBLOCK failed to start:\n' + e.message);
        }
      });
    })();
